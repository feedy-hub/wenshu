<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2">
  <title>文枢 · 论文研究工作台</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/katex/katex.min.css"><link rel="stylesheet" href="/style.css?v=6"><link rel="stylesheet" href="/refined.css?v=6"><link rel="stylesheet" href="/theme.css?v=7">
</head>
<body>
<a class="skip-link" href="#reading">跳到论文正文</a>
<nav class="workspace-rail" aria-label="工作台导航">
  <a class="brand" href="/" aria-label="文枢工作台首页"><span class="brand-mark" aria-hidden="true">文</span><span class="brand-name">文枢<small>让思考落在纸上</small></span></a>
  <div class="rail-section"><span class="rail-label">工作空间</span>
    <a class="rail-item current" href="#reading" id="nav-reader" aria-current="page"><span data-icon="book"></span><span>论文阅读</span></a>
    <button class="rail-item" id="source-editor"><span data-icon="code"></span><span>编辑源稿</span></button><button class="rail-item" id="compile"><span data-icon="play"></span><span>编译预览</span></button>
  </div>
  <div class="rail-section import-section"><span class="rail-label">导入论文</span>
    <label class="file-trigger rail-item" id="import" for="pdf-input" role="button" tabindex="0"><span data-icon="file-plus"></span><span>PDF 文档</span></label><label class="file-trigger rail-item" id="latex" title="导入单个 .tex 或项目 ZIP" for="tex-input" role="button" tabindex="0"><span data-icon="file-code"></span><span>LaTeX 项目</span></label><label class="file-trigger rail-item" id="folder-import" title="导入包含主文件和图表的文件夹" for="folder-input" role="button" tabindex="0"><span data-icon="folder"></span><span>项目文件夹</span></label>
  </div>
  <div class="rail-section contents-section" hidden><span class="rail-label">本篇目录</span><div id="document-outline" aria-label="论文章节"></div></div>
  <div class="rail-bottom"><button class="rail-item" id="demo"><span data-icon="spark"></span><span>示例论文</span></button><button class="rail-item" id="settings"><span data-icon="sliders"></span><span>AI 服务设置</span></button><div class="local-indicator"><span></span>本地工作区</div></div>
</nav>
<header class="workspace-header">
  <div class="document-picker"><span data-icon="document"></span><label class="sr-only" for="library">文献库</label><select id="library" aria-label="文献库"><option value="">选择文献</option></select></div><span id="document-meta" class="document-meta">论文阅读与修订</span><div class="header-actions"><button id="export" class="quiet-button"><span data-icon="download"></span><span>导出记录</span></button><details class="mobile-actions"><summary aria-label="更多工作台操作">更多</summary><div><button id="mobile-body">论文正文</button><button id="mobile-inspector">批注与修订</button><label class="file-trigger" for="pdf-input" role="button" tabindex="0">导入 PDF</label><label class="file-trigger" for="tex-input" role="button" tabindex="0">导入 LaTeX</label><label class="file-trigger" for="folder-input" role="button" tabindex="0">导入项目文件夹</label><button data-trigger="source-editor">编辑源稿</button><button data-trigger="compile">编译预览</button><button data-trigger="settings">AI 服务设置</button><button data-trigger="demo">示例论文</button></div></details></div>
</header>
<div class="toolbar" role="region" aria-label="阅读工具">
  <div class="reading-mode"><span data-icon="languages"></span><select id="granularity" aria-label="对照粒度"><option value="sentence">逐句对照</option><option value="paragraph">逐段对照</option></select></div><span class="tool-divider" aria-hidden="true"></span><label class="flow-toggle"><input id="smooth-reading" type="checkbox" checked><span>连续阅读</span></label><button id="pdf-toggle" class="quiet-button" aria-label="核对原 PDF" aria-pressed="false"><span data-icon="split"></span><span>核对原 PDF</span></button>
  <div class="toolbar-end"><button id="focus-mode" class="quiet-button" aria-label="专注阅读" aria-pressed="false"><span data-icon="focus"></span><span>专注阅读</span></button><details class="reading-options"><summary aria-label="阅读设置"><span data-icon="sliders"></span><span>设置</span></summary><div><label class="flow-toggle"><input id="show-artifacts" type="checkbox">显示页边标记</label><button id="project-export">导出 LaTeX 副本</button></div></details><button id="translate" class="primary"><span data-icon="languages"></span><span>生成全文对照</span></button></div>
</div>
<main id="workspace-main">
  <section id="pdf" hidden aria-label="原始 PDF"><div class="pdf-tools"><button id="prev" aria-label="上一页"><span data-icon="chevron-left"></span></button><span id="page-label"></span><button id="next" aria-label="下一页"><span data-icon="chevron-right"></span></button></div><div id="page-canvas"></div><p class="hint">高亮对应所选正文所在段落。</p></section>
  <section id="reading" tabindex="-1" aria-label="论文正文"><div class="empty"><div class="empty-paper" aria-hidden="true"><div class="paper-fold"></div><span class="paper-mini-title"></span><span></span><span></span><span class="mini-highlight"></span><span></span><span></span><i></i></div><h1>从一篇论文开始</h1><p>逐句阅读，随手批注，让每一次修改都有据可循。</p><div class="empty-actions"><label id="empty-folder" class="file-trigger primary" for="tex-input" role="button" tabindex="0"><span data-icon="folder"></span>导入论文项目</label><label id="empty-pdf" class="file-trigger" for="pdf-input" role="button" tabindex="0"><span data-icon="file-plus"></span>导入 PDF</label></div><button id="empty-demo" class="quiet-button empty-demo">先用示例体验<span data-icon="chevron-right"></span></button><div class="empty-footnote">支持 PDF、LaTeX 与项目文件夹</div></div></section>
  <aside class="inspector" aria-label="批注与修订">
    <div class="inspector-heading"><h2>批注与修订</h2><span class="inspector-dot" aria-hidden="true"></span><button id="inspector-close" class="quiet-button" aria-label="关闭批注面板"><span data-icon="close"></span></button></div>
    <div class="inspector-tabs" role="tablist" aria-label="修订工具"><button id="annotation-tab" role="tab" aria-selected="true" aria-controls="annotation-panel" tabindex="0">批注<span id="note-count">0</span></button><button id="revision-tab" role="tab" aria-selected="false" aria-controls="revision-panel" tabindex="-1">改写建议<span id="proposal-count">0</span></button></div>
    <div class="selection-label"><span data-icon="quote"></span><span>当前选区</span><button id="whole" class="quiet-button">选中整段</button></div><blockquote id="selection">点击一句正文，开始批注或改写。</blockquote>
    <div id="annotation-panel" role="tabpanel" aria-labelledby="annotation-tab"><label class="field-label" for="note">你的批注</label><textarea id="note" name="annotation" autocomplete="off" placeholder="例如：精简这句话，补充论据…"></textarea><div class="annotation-actions"><button id="save-note" class="primary"><span data-icon="plus"></span>保存批注</button><button id="rewrite"><span data-icon="spark"></span>改写选区</button></div><button id="translate-one" class="quiet-button translate-one"><span data-icon="languages"></span>翻译当前段落</button><div id="mapping" class="hint"></div><div class="list-heading"><h3>批注记录</h3><span>点击可定位原文</span></div><div id="notes"><p class="hint">选中正文后，写下第一条批注。</p></div></div>
    <div id="revision-panel" role="tabpanel" aria-labelledby="revision-tab" hidden><p class="panel-description">对照原文审阅每一处修改。</p><div id="proposals"><p class="hint">改写建议会保存在这里。</p></div><button id="batch-rewrite" class="batch-entry"><span data-icon="spark"></span>按批注修改全文</button></div>
    <div class="inspector-footer"><button id="context-manager" class="quiet-button"><span data-icon="sliders"></span>写作偏好与背景</button></div>
  </aside>
</main>
<footer class="workspace-status"><span class="status-dot" aria-hidden="true"></span><div id="status" role="status" aria-live="polite">选择已有论文，或导入一篇新论文</div><span class="status-end">文枢</span></footer>
<dialog id="visual-dialog" aria-labelledby="visual-title"><div class="lightbox-toolbar"><strong id="visual-title"></strong><span class="spacer"></span><button id="visual-minus" aria-label="缩小">−</button><output id="visual-zoom">100%</output><button id="visual-plus" aria-label="放大">＋</button><button id="visual-fit">适应窗口</button><button id="visual-original">核对原页</button><button id="visual-close" aria-label="关闭大图">关闭</button></div><div id="visual-stage"></div><div id="visual-caption"></div></dialog><dialog id="modal" aria-label="文枢操作窗口"><div id="modal-content"></div><button id="close">关闭</button></dialog>
<input id="pdf-input" type="file" accept=".pdf,application/pdf" class="file-input" tabindex="-1" aria-label="选择 PDF 文档"><input id="tex-input" type="file" accept=".tex,.zip" class="file-input" tabindex="-1" aria-label="选择论文项目文件"><input id="folder-input" type="file" webkitdirectory directory multiple class="file-input" tabindex="-1" aria-label="选择论文项目文件夹">
<script src="/vendor/katex/katex.min.js"></script><script src="/vendor/katex/contrib/auto-render.min.js"></script><script src="/app.js?v=7"></script><script src="/context.js"></script><script src="/editor.js"></script><script src="/batch.js"></script>
</body>
</html>
